name: Build & Release Tachyon Desktop (Windows, Linux, macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Опциональный тег релиза (например v0.3.1) для создания GitHub Release вручную'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (x86_64 .deb + .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tachyon-desktop
        uses: actions/checkout@v4
        with:
          path: tachyon-desktop

      - name: Checkout tachyon-core
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: tachyon-core

      - name: Apply desktop runtime patch to tachyon-core
        shell: bash
        run: |
          if git -C tachyon-core apply --check --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/tachyon-core-desktop.patch 2>/dev/null; then
            git -C tachyon-core apply --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/tachyon-core-desktop.patch
          else
            echo "Desktop runtime patch already upstreamed in tachyon-core, skipping."
          fi
          cp -r tachyon-desktop/desktop-rs/patches/wintun_driver tachyon-core/crates/core-runtime/src/inbound/
          if git -C tachyon-core apply --check --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/pure-rust-wintun.patch 2>/dev/null; then
            git -C tachyon-core apply --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/pure-rust-wintun.patch
          else
            echo "Pure-Rust Wintun patch already upstreamed in tachyon-core, skipping."
          fi

      - name: Install WebKitGTK & GTK3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            dpkg-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Package Linux (.deb, .tar.gz & binary)
        working-directory: tachyon-desktop
        run: |
          RAW_TAG="${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          VER="${RAW_TAG#v}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VER="0.3.5"; fi
          chmod +x desktop-rs/scripts/package-linux.sh
          ./desktop-rs/scripts/package-linux.sh "${VER}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tachyon-Linux-x86_64
          path: |
            tachyon-desktop/dist/*.deb
            tachyon-desktop/dist/*.tar.gz
            tachyon-desktop/dist/tachyon-desktop-linux-*

  build-macos:
    name: macOS (Universal Apple Silicon + Intel .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout tachyon-desktop
        uses: actions/checkout@v4
        with:
          path: tachyon-desktop

      - name: Checkout tachyon-core
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: tachyon-core

      - name: Apply desktop runtime patch to tachyon-core
        shell: bash
        run: |
          if git -C tachyon-core apply --check --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/tachyon-core-desktop.patch 2>/dev/null; then
            git -C tachyon-core apply --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/tachyon-core-desktop.patch
          else
            echo "Desktop runtime patch already upstreamed in tachyon-core, skipping."
          fi
          cp -r tachyon-desktop/desktop-rs/patches/wintun_driver tachyon-core/crates/core-runtime/src/inbound/
          if git -C tachyon-core apply --check --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/pure-rust-wintun.patch 2>/dev/null; then
            git -C tachyon-core apply --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/pure-rust-wintun.patch
          else
            echo "Pure-Rust Wintun patch already upstreamed in tachyon-core, skipping."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Package macOS (.app, .dmg & universal binary)
        working-directory: tachyon-desktop
        run: |
          RAW_TAG="${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          VER="${RAW_TAG#v}"
          if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VER="0.3.5"; fi
          chmod +x desktop-rs/scripts/package-macos.sh
          ./desktop-rs/scripts/package-macos.sh --universal "${VER}"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tachyon-macOS-Universal
          path: |
            tachyon-desktop/dist/*.dmg
            tachyon-desktop/dist/tachyon-desktop-macos-universal

  build-windows:
    name: Windows (x86_64 .exe & .zip — Pure Rust)
    runs-on: windows-latest
    steps:
      - name: Checkout tachyon-desktop
        uses: actions/checkout@v4
        with:
          path: tachyon-desktop

      - name: Checkout tachyon-core
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: tachyon-core

      - name: Apply desktop runtime patch to tachyon-core
        shell: bash
        run: |
          if git -C tachyon-core apply --check --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/tachyon-core-desktop.patch 2>/dev/null; then
            git -C tachyon-core apply --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/tachyon-core-desktop.patch
          else
            echo "Desktop runtime patch already upstreamed in tachyon-core, skipping."
          fi
          cp -r tachyon-desktop/desktop-rs/patches/wintun_driver tachyon-core/crates/core-runtime/src/inbound/
          if git -C tachyon-core apply --check --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/pure-rust-wintun.patch 2>/dev/null; then
            git -C tachyon-core apply --ignore-whitespace ../tachyon-desktop/desktop-rs/patches/pure-rust-wintun.patch
          else
            echo "Pure-Rust Wintun patch already upstreamed in tachyon-core, skipping."
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Client (desktop-rs)
        working-directory: tachyon-desktop/desktop-rs
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path "../dist" | Out-Null
          Copy-Item "target/release/tachyon.exe" "../dist/Tachyon-windows-x86_64.exe"
          Compress-Archive -Path "../dist/Tachyon-windows-x86_64.exe" -DestinationPath "../dist/Tachyon-windows-x86_64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tachyon-Windows-x64
          path: |
            tachyon-desktop/dist/Tachyon-windows-x86_64.exe
            tachyon-desktop/dist/Tachyon-windows-x86_64.zip

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          chmod +x tachyon-desktop-linux-* tachyon-desktop-macos-* 2>/dev/null || true
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: "Tachyon Desktop ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          generate_release_notes: false
          files: release-assets/*
