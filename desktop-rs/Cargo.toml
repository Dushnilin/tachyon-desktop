[package]
name = "tachyon-desktop"
version = "0.3.8"
edition = "2024"
description = "Tachyon Cross-Platform Desktop Client (Linux, macOS, Windows) with embedded tachyon-core"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Dushnilin/tachyon-desktop"

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
core-config = { path = "../../tachyon-core/crates/core-config", default-features = false, features = ["full"] }
core-runtime = { path = "../../tachyon-core/crates/core-runtime", default-features = false, features = ["full"] }
anyhow = "1"
base64 = "0.22"
flate2 = "1"
getrandom = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
gpui-kit = "0.9.1"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
tokio = { version = "1", features = ["full"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
] }

[patch.crates-io]
h2 = { path = "../../tachyon-core/vendor/h2" }
h3 = { path = "../../tachyon-core/vendor/h3" }
quinn = { path = "../../tachyon-core/vendor/quinn" }
quinn-proto = { path = "../../tachyon-core/vendor/quinn-proto" }
smoltcp = { path = "../../tachyon-core/vendor/smoltcp" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false

# Критичные по скорости крипто- и транспортные крейты собираем с opt-level = 3
[profile.release.package.core-crypto]
opt-level = 3
[profile.release.package.aes]
